<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" type="text/css" href="form.css">
</head>
<body>
   
    <div class="form-container">
        <h1>Feedback Form</h1>  
        <form>
            <label for="name">Full Name <span class="mandatory">*</span></label>
            <input type="text" id="name" name="name" placeholder="Your Name" minlength="3" required>  <!--Add palceholder value-->
            
            <label for="email">Email<span class="mandatory">*</span></label>
            <input type="email" id="email" name="email" placeholder="Your Email" required  pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"> <!--Add pattern for email-->
            

            <label for="password">Password<span class="mandatory">*</span></label>
            <input type="password" id="password" name="password" maxlength="10" required> <!--set maxlength and required attribute-->

            <label for="category">Category</label>
            <select name="category" id="category">
                <option value="design" selected>Design</option> <!--set selected attribute as Positive-->
                <option value="quality">Quality</option> 
                <option value="img_clarity">Image Clarity</option> 
            </select>
            <fieldset>
                <legend>Contact Method</legend>
                <input type="radio" id="mobile" name="contact-method" value="mobile">
                <label for="mobile">Mobile</label>
                <input type="radio" id="landline" name="contact-method" value="landline">
                <label for="landline">Landline</label>
            </fieldset>

            <fieldset>
                <legend>Additional Features</legend>
                <input type="checkbox" id="solution" name="solution" value="solution">
                <label for="solution">Solution</label>     
                <input type="checkbox" id="ak" name="ak" value="ak">
                <label for="ak">Agent Knowledge</label> 
                <input type="checkbox" id="help" name="help" value="help">
                <label for="help">Helpfulness</label>         
            </fieldset>
            <label for="message">Comments</label>
            <textarea name="message1" rows="10" cols="30">Enter your message here!</textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
        
</body>
</html>
